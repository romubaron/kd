# Formulaire d'issue lu par Gravity. Les trois titres (Goal, Acceptance criteria,
# Dependencies) doivent rester mot pour mot ceux de gravity.yaml : Gravity les cherche
# dans le corps de l'issue.
#
# labels: agent:ready, choix du propriétaire du dépôt (2026-10-27) : une issue créée par
# ce formulaire est autorisée d'office. La porte humaine qui reste est l'approbation de la
# proposition dans GCC (ADR-0038) : rien n'est implémenté sans elle. Retirer la ligne
# labels pour revenir à une autorisation posée à la main.

name: Demande de modification
description: Une modification du site, que Gravity réalisera après approbation
labels: ["agent:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Décris une seule modification par issue. Un agent la réalisera et ouvrira une pull request ; elle ne sera faite qu'après approbation dans la console Gravity.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: >-
        L'objectif, en une ou deux phrases : ce qui doit être vrai sur le site une fois la modification faite.
      placeholder: La page d'accueil affiche une section Vidéos avec mes trois derniers reportages.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Les critères vérifiables, un par ligne, chacun commençant par « - ». Donne les textes exacts et les liens complets ; l'agent n'invente rien.
      placeholder: |
        - la section #videos apparaît après Réalisations
        - elle intègre https://www.youtube.com/watch?v=...
        - python3 check.py passe
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >-
        Écris simplement None. Si cette modification doit attendre une autre issue, écris « - #12 » (une par ligne).
      value: None
    validations:
      required: true
